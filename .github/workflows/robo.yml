name: Executar Robô de Licitações TCM-PA

on:
  workflow_dispatch: # Permite rodar manualmente
  schedule:
    - cron: '0 8 * * *' # Roda automaticamente todo dia às 8h

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-api-python-client google-auth gspread

      - name: Executar Script Python
        env:
          GOOGLE_DRIVE_JSON: ${{ secrets.GOOGLE_DRIVE_JSON }}
          MODO_TESTE: "true" # Altere para "false" quando quiser rodar para todas as URLs
        run: python robo_licitacoes.py
